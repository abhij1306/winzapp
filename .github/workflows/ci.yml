name: CI

"on":
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: winzapp
          POSTGRES_PASSWORD: winzapp
          POSTGRES_DB: winzapp
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U winzapp -d winzapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://winzapp:winzapp@localhost:55432/winzapp
      TEST_DATABASE_URL: postgresql+asyncpg://winzapp:winzapp@localhost:55432/winzapp
      REDIS_URL: redis://localhost:6379/0
      WA_APP_SECRET: test-secret
      WA_VERIFY_TOKEN: verify-token
      WA_ACCESS_TOKEN: test-access-token
      LLM_PROVIDER: groq
      LLM_MODEL: llama-3.3-70b-versatile
      GROQ_API_KEY: test-groq-key
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_KEY: test-supabase-key
      JWT_SECRET: test-jwt-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest

      - name: Type check
        run: python -m mypy app

      - name: Lint
        run: python -m ruff check app tests
